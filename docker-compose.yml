
services:
  postgres:
    image: postgres:15
    container_name: ci_debugger_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ci_debugger
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ci_debugger_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ci_debugger"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: ci_debugger_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/ci_debugger
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      GITHUB_API_TOKEN: ${GITHUB_API_TOKEN}
      GITHUB_API_CONNECT_TIMEOUT_MS: ${GITHUB_API_CONNECT_TIMEOUT_MS}
      GITHUB_API_READ_TIMEOUT_MS: ${GITHUB_API_READ_TIMEOUT_MS}
      JOB_SCHEDULER_INTERVAL_MS: ${JOB_SCHEDULER_INTERVAL_MS}
    ports:
      - "8080:8080"

volumes:
  ci_debugger_pgdata: